# Dishes for the starter recipe library. See README.md.
#
# Same shape as seed/menu.yaml with price, gst and popularity removed - those are per-restaurant.
# recipe lives on the VARIANT (Half / Full / Piece): a half plate is a different recipe.
# recipe[].qty is in the referenced item's base unit; ref is an ingredient or preparation code.
# confidence: seed_calibrated | derived | estimated; derived names its template in basis.
# aliases: other menu names the same dish appears under, for the onboarding matcher.
#
# The first block is emitted by `python library/from_seed.py dishes`. Do not edit it here.

categories:
  - {code: SOUP,           name: Soups,                seq: 1}
  - {code: STARTER_VEG,    name: Veg Starters,         seq: 2}
  - {code: STARTER_NONVEG, name: Non-Veg Starters,     seq: 3}
  - {code: MAIN_VEG,       name: Veg Main Course,      seq: 4}
  - {code: MAIN_NONVEG,    name: Non-Veg Main Course,  seq: 5}
  - {code: RICE_BREAD,     name: Rice & Breads,        seq: 6}
  - {code: CHINESE,        name: Chinese,              seq: 7}
  - {code: SOUTH_INDIAN,   name: South Indian,         seq: 8}
  - {code: ACCOMPANIMENT,  name: Accompaniments,       seq: 9}
  - {code: DESSERT,        name: Desserts,             seq: 10}

