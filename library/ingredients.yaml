# Ingredient master for the starter recipe library. See README.md.
#
# base_unit: g | ml | unit  - all recipe quantities are in base_unit (CLAUDE.md invariant 5).
# yield_factor: usable fraction after trim/cleaning loss (1.0 = no loss).
# shelf_life_days: at normal storage for that item.
# There is NO price column. Prices are per-restaurant and bootstrap from a market-rate table.
#
# The first block is copied from seed/ingredients.yaml by `python library/from_seed.py ingredients`
# and validate.py asserts it still matches. The second block is library-only; its yield factors and
# shelf lives are estimated and await a chef.

