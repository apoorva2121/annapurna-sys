# Preparations for the starter recipe library. See README.md and ADR 0006.
#
# A preparation is a base made in a batch that feeds several dishes. Dishes consume it by
# quantity in yield_unit. Nesting depth is at most 3 (validate.py enforces the same rule as seed/).
#
# batch_yield / yield_unit : one realistic morning batch for a 40-60 cover restaurant
# shelf_life_hours         : HOURS, not days
# lines[].unit             : must equal the referenced item's base unit (validate.py checks)
# confidence               : seed_calibrated | derived | estimated (README.md § Confidence)
#
# The first block is emitted by `python library/from_seed.py preparations`. Do not edit it here.

meta:
  nesting_depth_limit: 3

preparations:

