# Menu and dish recipes for "Spice Garden". Prices in INR, exclusive of GST.
#
# price / recipe live on the VARIANT, never on the item - a half plate is a different price,
# a different recipe and a different food cost. See docs/domain-model.md.
#
# gst: 5 = standard restaurant rate (no ITC). popularity: relative demand weight used by the
# order generator; the top 8 dishes carry ~55pc of covers by design.
# recipe[].ref is an ingredient code or a preparation code.

meta:
  currency: INR
  gst_default: 5
  price_effective: 2026-09-01

categories:
  - {code: STARTER_VEG,   name: Veg Starters,     seq: 1}
