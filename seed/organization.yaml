# Tenancy, staff, roles and permissions for the synthetic restaurant "Spice Garden".
# Two restaurants exist ON PURPOSE: every tenant-isolation test needs a second tenant to fail
# against, and a bug that only appears with two tenants is the worst bug this product can have.
#
# All seeded logins use the password below. Seeded orgs carry is_demo: true and are excluded
# from every report (docs/seed-data.md).

meta:
  seed_password: "Staging#2026"
  is_demo: true

organizations:
  - code: SPICEGARDEN
    name: Spice Garden Hospitality
    slug: spice-garden
    plan: active
    billing_email: owner@spicegarden.test

  # Second tenant. Minimal on purpose - it exists to be denied access to the first.
  - code: TANDOORHOUSE
    name: Tandoor House
    slug: tandoor-house
    plan: trial
    billing_email: owner@tandoorhouse.test

restaurants:
  - code: SG_KOREGAON
    organization: SPICEGARDEN
    name: Spice Garden - Koregaon Park
    timezone: Asia/Kolkata
    currency: INR
    business_day_start: "05:00"          # ADR 0004. NOT midnight - the 01:30 order books to today.
    gstin: 27AABCS1429B1ZX
    address: {line1: "Lane 5, Koregaon Park", city: Pune, state: Maharashtra, pincode: "411001"}
    fssai_licence: "11522998000123"

  # A second branch of Spice Garden, and the only reason it exists: without two restaurants in one
  # organization, `POST /auth/switch` (finding S12) cannot be exercised by hand at all — the
  # switcher renders nothing for someone who works at one place. A feature nobody can see is a
  # feature nobody can check.
  - code: SG_BANER
    organization: SPICEGARDEN
    name: Spice Garden - Baner
    timezone: Asia/Kolkata
    currency: INR
    business_day_start: "05:00"
    gstin: 27AABCS1429B1ZX
    address: {line1: "Baner Road", city: Pune, state: Maharashtra, pincode: "411045"}
    fssai_licence: "11522998000789"

  - code: TH_BANER
    organization: TANDOORHOUSE
    name: Tandoor House - Baner
    timezone: Asia/Kolkata
    currency: INR
    business_day_start: "05:00"
    gstin: 27AAFCT2938K1Z9
    address: {line1: "Baner Road", city: Pune, state: Maharashtra, pincode: "411045"}
    fssai_licence: "11522998000456"

# ---------------------------------------------------------------- permissions
# Static catalogue, seeded by migration. Code checks THESE, never a role name (ADR 0007).
permissions:
  # orders
  - {code: order.view,              resource: order,       action: view}
  - {code: order.create,            resource: order,       action: create}
  - {code: order.modify,            resource: order,       action: modify}
  - {code: order.settle,            resource: order,       action: settle}
  - {code: order.void,              resource: order,       action: void}
  - {code: order.discount,          resource: order,       action: discount}
  # till - AMENDED by docs/modules/M07-orders-spec.md. The P1 design had no cash permission, and
  # a waiter holding order.settle takes cash but must not close the till it went into.
  - {code: cash.manage,             resource: cash,        action: manage}
  # floor - ADDED by the backlog-issues run (B2, 2026-09-13). Busy mode: a settled table is free
  # at once instead of being cleared first. It changes every table, so it is not a waiter's switch.
  - {code: floor.manage,            resource: floor,       action: manage}
  # orders - ADDED 2026-09-14 (waiter assignment). Who serves a table: chosen when someone else
  # opens the order, and moved from one waiter to another with a reason. A waiter claims only an
  # order nobody is serving - taking a busy table would take its credit (ADR 0011).
  - {code: order.assign,            resource: order,       action: assign}
  # kitchen
  - {code: kot.view,                resource: kot,         action: view}
  - {code: kot.update,              resource: kot,         action: update}
  # menu & recipes
  - {code: menu.view,               resource: menu,        action: view}
  - {code: menu.manage,             resource: menu,        action: manage}
  - {code: menu.price,              resource: menu,        action: price}
  - {code: recipe.view,             resource: recipe,      action: view}
  - {code: recipe.manage,           resource: recipe,      action: manage}
  - {code: cost.view,               resource: cost,        action: view}
  # stock
  - {code: stock.view,              resource: stock,       action: view}
  - {code: stock.receive,           resource: stock,       action: receive}
  - {code: stock.produce,           resource: stock,       action: produce}
  - {code: stock.adjust,            resource: stock,       action: adjust}
  - {code: stock.count,             resource: stock,       action: count}
  - {code: wastage.log,             resource: wastage,     action: log}
  - {code: wastage.approve,         resource: wastage,     action: approve}
  # procurement
  - {code: supplier.view,           resource: supplier,    action: view}
  - {code: supplier.manage,         resource: supplier,    action: manage}
  - {code: purchase.manage,         resource: purchase,    action: manage}
  # people
  # M01 split `employee.manage` into the five below. A single `manage` could not express the
  # seniority ladder — a manager may create staff and reset a junior's password but must never
  # assign a role above their own — and the ladder is what stops self-promotion. `employee.manage`
  # is kept for the later modules whose roles still reference it.
  - {code: employee.view,           resource: employee,    action: view}
  - {code: employee.manage,         resource: employee,    action: manage}
  - {code: employee.create,         resource: employee,    action: create}
  - {code: employee.edit,           resource: employee,    action: edit}
  - {code: employee.deactivate,     resource: employee,    action: deactivate}
  - {code: employee.role.assign,    resource: employee.role,    action: assign}
  - {code: employee.password.reset, resource: employee.password, action: reset}
  - {code: employee.wage.view,      resource: employee,    action: wage_view}   # separately gated
  # M12 amendment: granted to EVERY role, not only the manager. A roster nobody can read is a
  # noticeboard in a locked room, and the clock-in button is useless to the person it exists for
  # if a permission stands in front of it. The permission opens the screen; the scope decides the
  # content, so corrections and the week's statuses stay behind shift.manage.
  - {code: shift.view,              resource: shift,       action: view}
  - {code: shift.manage,            resource: shift,       action: manage}
  # customers
  - {code: customer.view,           resource: customer,    action: view}
  - {code: customer.manage,         resource: customer,    action: manage}
  - {code: feedback.view,           resource: feedback,    action: view}
  - {code: complaint.manage,        resource: complaint,   action: manage}
  # comms
  - {code: message.send,            resource: message,     action: send}
  - {code: task.view,               resource: task,        action: view}
  - {code: task.assign,             resource: task,        action: assign}
  - {code: task.complete,           resource: task,        action: complete}
  # reporting
  - {code: report.operational.view, resource: report,      action: operational_view}
  - {code: report.financial.view,   resource: report,      action: financial_view}
  - {code: audit.view,              resource: audit,       action: view}
  # performance - ADR 0011
  - {code: performance.view.own,    resource: performance, action: view_own}    # EVERY role. Always.
  - {code: performance.view.team,   resource: performance, action: view_team}
  - {code: performance.publish,     resource: performance, action: publish}
  - {code: incentive.configure,     resource: incentive,   action: configure}
  - {code: recognition.award,       resource: recognition, action: award}
  # compliance - M18. Two, not one: seeing what is wrong and deciding to set it aside are
  # different acts, and the second is the one an inspection reads.
  - {code: compliance.view,         resource: compliance,  action: view}
  - {code: compliance.act,          resource: compliance,  action: act}
  # admin
  - {code: restaurant.configure,    resource: restaurant,  action: configure}
  - {code: role.view,               resource: role,        action: view}     # read the catalogue
  - {code: role.manage,             resource: role,        action: manage}

# ---------------------------------------------------------------- roles
# is_system roles cannot be deleted. performance.view.own is on EVERY role by design (ADR 0011):
# a score an employee cannot see is surveillance; the same score, visible, is feedback.
roles:
  - code: owner
    name: Owner
    is_system: true
    permissions: ["*"]

  - code: admin
    name: Administrator
    is_system: true
    permissions:
      - restaurant.configure
      - role.manage
      - employee.view
      - employee.manage
      - audit.view
      - menu.view
      - performance.view.own
      - compliance.view, compliance.act

  - code: manager
    name: Restaurant Manager
    is_system: true
    permissions:
      - order.view, order.create, order.modify, order.settle, order.void, order.discount
      - cash.manage                    # M07 amendment
      - floor.manage                   # busy mode on the floor (backlog-issues B2)
      - order.assign                   # who serves a table (waiter assignment, 2026-09-14)
      # A waiter locked out mid-shift is a weekly event; an owner locked out is not. Until
      # 2026-09-19 only the owner could reset a password, so every forgotten password walked to
      # them — and the login screen told people to "ask your manager or the owner", which was
      # false. Escalation is already closed by `may_reset_password`: strictly more senior, so a
      # manager still cannot take an owner's account.
      - employee.password.reset        # `employee.view` is already granted below
      - kot.view, kot.update
      - menu.view, menu.manage
      - recipe.view, cost.view
      - stock.view, stock.receive, stock.produce, stock.adjust, stock.count
      - wastage.log, wastage.approve
      - supplier.view, supplier.manage, purchase.manage
      - employee.view, employee.manage, shift.view, shift.manage
      - customer.view, customer.manage, feedback.view, complaint.manage
      - message.send, task.view, task.assign, task.complete
      - report.operational.view
      - performance.view.own, performance.view.team, recognition.award
      - compliance.view
    # deliberately NOT granted: menu.price, report.financial.view, employee.wage.view,
    # incentive.configure, performance.publish - these are the owner's.

  - code: chef
    name: Chef / Kitchen Manager
    is_system: true
    permissions:
      - kot.view, kot.update
      - menu.view, recipe.view, recipe.manage
      - stock.view, stock.produce, wastage.log
      - message.send, task.view, task.complete
      - performance.view.own, performance.view.team
    # NOT granted: any price, cost or financial permission. A chef sees grams, not rupees.

  - code: kitchen_staff
    name: Kitchen Staff
    is_system: true
    permissions:
      - kot.view, kot.update
      - recipe.view, stock.view, wastage.log
      - message.send, task.view, task.complete
      - performance.view.own

  - code: waiter
    name: Waiter / Captain
    is_system: true
    permissions:
      - order.view, order.create, order.modify, order.settle
      - kot.view, menu.view
      - customer.view, feedback.view
      - message.send, task.view, task.complete
      - performance.view.own
    # NOT granted: order.void, order.discount, cost.view - the classic leakage vectors.
    # Nor cash.manage (M07): a waiter takes cash and never closes the till it went into.

  - code: store_manager
    name: Inventory / Store Manager
    is_system: true
    permissions:
      - stock.view, stock.receive, stock.produce, stock.adjust, stock.count
      - wastage.log, wastage.approve
      - supplier.view, supplier.manage, purchase.manage
      - recipe.view, message.send, task.view, task.complete
      - report.operational.view
      - performance.view.own

  - code: cleaner
    name: Cleaner / Housekeeping
    is_system: true
    permissions:
      - message.send, task.view, task.complete
      - performance.view.own

  - code: accountant
    name: Accountant / Finance
    is_system: true
    permissions:
      - order.view, report.financial.view, report.operational.view
      - supplier.view, purchase.manage, audit.view
      - employee.wage.view
      - performance.view.own
      - compliance.view

