# Staging deploy (remediation R7, and R4's "one origin" which can only be proven by deploying).
#
# Runs on push to main, after CI has passed. The order below is not arbitrary and the comments say
# why each step is where it is; changing the order is how a deploy starts lying about what is live.
#
# Authentication is Workload Identity Federation, never a JSON service-account key. A key in a
# repository secret is a long-lived credential that leaks with the repository; WIF mints a token
# scoped to this workflow on this branch, valid for minutes.
#
# ONE-TIME SETUP lives in docs/deploy/gcp-staging-runbook.md. Until the four repository variables
# and the Neon secret exist, this workflow is inert by design: it checks them first and stops with
# a sentence naming what is missing, rather than failing deep inside a gcloud call.

name: Deploy staging

on:
  push:
    branches: [main]
  # Deploying the same commit twice must be possible without an empty commit: a secret rotation or
  # a Cloud Run setting change needs a redeploy of code that has not moved.
  workflow_dispatch:

# Never two deploys racing to be the live revision. Not cancel-in-progress: killing a deploy
# half way through leaves the migrate job's outcome unknown, which is worse than queueing.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  # Required for WIF: this is what lets the job request an OIDC token from GitHub.
  id-token: write

env:
  # Singapore, not Mumbai. Neon has no ap-south-1 region (checked 2026-09-17), so the database
  # lives in ap-southeast-1 and the service is co-located with it: a page load makes several
  # queries, and a split pays the cross-region hop per query instead of once per request.
  REGION: asia-southeast1
  SERVICE: restaurant-os-api
  REPOSITORY: restaurant-os
  # The identity the container runs AS, which is not the identity that deploys it.
  # `github-deploy` pushes images and calls the Cloud Run API; the revision itself runs as this
  # one, which can read two secrets and do nothing else. Without --service-account, Cloud Run uses
  # the default compute account — which carries project Editor, and which the first deploy failed
  # on with "Permission denied on secret ... for Revision service account
  # 484549832300-compute@developer.gserviceaccount.com". Granting that account the secrets would
  # have worked and would have left the application running as an Editor.
  RUNTIME_SA: restaurant-os-run@restaurant-os-508914.iam.gserviceaccount.com

jobs:
  # Until §1-§7 of docs/deploy/gcp-staging-runbook.md have been done, there is no project to deploy
  # to. This job is then **skipped**, not failed: a red X on every push to main for a deployment
  # nobody has set up yet is noise, and a repository whose default branch is permanently red is one
  # where a real failure stops being visible. The condition is on the job so the skip is a grey tick
  # rather than a failed step.
  #
  # `vars.GCP_PROJECT_ID` is a repository *variable*, not a secret — it is not sensitive, and a
  # variable can be read in an `if:` where a secret cannot.
  deploy:
    name: build · migrate · deploy · smoke
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v4

      # Past the `if:` above, the project exists but a piece of it may not. Fail here with a
      # sentence naming what is missing, rather than 40 lines into a gcloud error.
      - name: Check the one-time setup is complete
        run: |
          missing=""
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] || missing="$missing GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_DEPLOY_SA }}" ]    || missing="$missing GCP_DEPLOY_SA"
          if [ -n "$missing" ]; then
            echo "::error::GCP_PROJECT_ID is set but these are not:$missing"
            echo "See docs/deploy/gcp-staging-runbook.md §5-§7."
            exit 1
          fi

      # ---------------------------------------------------------------- frontend
      # Built here, not in the image. `backend/Dockerfile` already copies its whole context and
      # .dockerignore excludes dist/ but not static/, so dropping the bundle at backend/static puts
      # it at /app/static with no second copy of the image's build logic to drift (R4, option B).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        run: npm ci && npm run build
        working-directory: frontend

      # The seed YAML lives at the repository root because it describes the product, not the
      # backend, and `docker-compose.yml` bind-mounts only `backend/`. The image's build context is
      # `backend/`, so it has to be copied in the same way the frontend bundle is — and the job
      # then points SEED_DIR at it. Without this the seeder exits 2 with "Could not find
      # organization.yaml", which is correct and unhelpful on a deployment nobody can bind-mount.
      - name: Move the bundle and the seed data into the backend build context
        run: |
          rm -rf backend/static backend/seed-data
          cp -r frontend/dist backend/static
          cp -r seed backend/seed-data
          # Both bundles must be present. ADR 0009's guest app is a separate Rollup entry, and an
          # image missing guest.html serves a QR code that 404s on a table.
          test -f backend/static/index.html || { echo "::error::no index.html in the bundle"; exit 1; }
          test -f backend/static/guest.html || { echo "::error::no guest.html in the bundle"; exit 1; }
          test -f backend/seed-data/organization.yaml || { echo "::error::no seed data in the image"; exit 1; }

      # ---------------------------------------------------------------- auth
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ---------------------------------------------------------------- image
      - name: Build and push
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          # GIT_SHA and BUILT_AT are why /api/v1/version can answer without a .git directory in the
          # image. Omit them and version reports "unknown", and nobody can tell what is serving —
          # scripts/smoke_prod.py fails on exactly that.
          docker build backend \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILT_AT="$(date -u +%FT%TZ)" \
            --tag "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- migrate
      # A Cloud Run *Job*, run to completion BEFORE the service is deployed. The other order gives
      # a window where new code queries columns that do not exist yet, which is an outage.
      #
      # It gets the same environment as the service, not a smaller one, because it runs the same
      # image and therefore builds the same Settings object under the same validation. `env` is
      # required with no default, and `jwt_secret` is required whenever ENV is not local. A
      # migration never signs a token, but the settings model refuses to exist without a secret —
      # and refusing is correct, because the alternative is a staging deployment quietly running on
      # the development value committed to this repository.
      #
      # Passing only DATABASE_URL failed inside the container, after a perfectly clean
      # `gcloud run jobs deploy`, with "1 validation error for Settings / env / Field required".
      - name: Migrate
        run: |
          gcloud run jobs deploy migrate \
            --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" \
            --command python --args=-m,alembic,upgrade,head \
            --service-account "$RUNTIME_SA" \
            --set-env-vars ENV=staging,DEBUG=false,LOG_LEVEL=INFO \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest \
            --max-retries 0 --task-timeout 10m --quiet
          gcloud run jobs execute migrate --region "$REGION" --wait

      # ---------------------------------------------------------------- deploy
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --concurrency 40 \
            --max-instances 3 \
            --min-instances "${{ vars.GCP_MIN_INSTANCES || '0' }}" \
            --service-account "$RUNTIME_SA" \
            --set-env-vars ENV=staging,DEBUG=false,LOG_LEVEL=INFO,STATIC_DIR=/app/static \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest \
            --quiet
          # CORS_ORIGINS is deliberately absent. One origin (R4) means the browser never makes a
          # cross-origin request, so an allow-list here would be permission nothing needs.

      # ---------------------------------------------------------------- verify
      # The deploy is not done until something outside it agrees. --expect-sha is what makes this a
      # check rather than a formality: without it a previous revision still serving traffic would
      # pass every assertion.
      - name: Smoke test the deployed revision
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          echo "Deployed: $URL"
          python scripts/smoke_prod.py --base "$URL" --expect-sha "${GITHUB_SHA}"

      - name: Roll back if the smoke test failed
        if: failure()
        run: |
          echo "::warning::Smoke test failed. The previous revision is still receiving traffic only"
          echo "if this deploy did not complete. Check the revision list and route traffic back:"
          echo "  gcloud run revisions list --service $SERVICE --region $REGION"
          echo "  gcloud run services update-traffic $SERVICE --region $REGION --to-revisions <prev>=100"
